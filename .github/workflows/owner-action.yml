name: owner-action

run-name: "owner ${{ inputs.action }} ${{ inputs.repo }} ${{ inputs.id }} ${{ inputs.body && format('body={0} ', toJSON(inputs.body)) || '' }}| reason (agent-provided): ${{ inputs.reason }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: Named owner action (fixed list)
        type: choice
        required: true
        options:
          - ruleset-create
          - ruleset-update
          - ruleset-delete
          - repo-create
          - repo-settings
          - repo-archive
          - actions-workflow-permissions
          - vulnerability-alerts-enable
          - test-read-org
      repo:
        description: Repo name under Nishfleet (only for repo actions)
        type: string
        required: false
      id:
        description: Numeric ruleset id (only for update/delete actions)
        type: string
        required: false
      body:
        description: JSON object body (only for actions that take one; never put secrets here)
        type: string
        required: false
      reason:
        description: Plain-English reason; must name the target (ids are not resolved for the owner)
        type: string
        required: true

permissions: {}

jobs:
  announce:
    name: announce request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      method: ${{ steps.resolve.outputs.method }}
      endpoint: ${{ steps.resolve.outputs.endpoint }}
      body_sha256: ${{ steps.resolve.outputs.body_sha256 }}
    steps:
      - name: Check out the workflow files
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Validate the request
        id: resolve
        uses: ./.github/actions/validate-inputs
        with:
          action: ${{ inputs.action }}
          repo: ${{ inputs.repo }}
          id: ${{ inputs.id }}
          body: ${{ inputs.body }}

      - name: Show what the owner is asked to approve
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          METHOD: ${{ steps.resolve.outputs.method }}
          ENDPOINT: ${{ steps.resolve.outputs.endpoint }}
          SHA: ${{ steps.resolve.outputs.body_sha256 }}
          PAYLOAD: ${{ steps.resolve.outputs.payload }}
        run: |
          set -uo pipefail

          if [[ -n "$PAYLOAD" ]]; then
            full="$PAYLOAD"
          else
            full="(none)"
          fi

          # Full request, readable on the run page and in the log. Public by contract.
          echo "OWNER APPROVAL REQUEST: action=$ACTION method=$METHOD endpoint=$ENDPOINT body_sha256=$SHA body=$full"
          {
            echo "### Owner approval request"
            echo
            echo "- action: \`$ACTION\`"
            echo "- method: \`$METHOD\`"
            echo "- endpoint: \`$ENDPOINT\`"
            echo "- body sha256: \`$SHA\`"
            echo
            echo "Full body (compacted JSON):"
            echo
            echo '```json'
            echo "$full"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  act:
    name: owner api call
    needs: announce
    runs-on: ubuntu-24.04
    environment: owner
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the workflow files
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Validate the request
        id: resolve
        uses: ./.github/actions/validate-inputs
        with:
          action: ${{ inputs.action }}
          repo: ${{ inputs.repo }}
          id: ${{ inputs.id }}
          body: ${{ inputs.body }}

      - name: Re-validate against announce and call GitHub API as owner
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          METHOD: ${{ steps.resolve.outputs.method }}
          ENDPOINT: ${{ steps.resolve.outputs.endpoint }}
          PAYLOAD: ${{ steps.resolve.outputs.payload }}
          EXPECT_METHOD: ${{ needs.announce.outputs.method }}
          EXPECT_ENDPOINT: ${{ needs.announce.outputs.endpoint }}
          EXPECT_SHA256: ${{ needs.announce.outputs.body_sha256 }}
          GH_TOKEN: ${{ secrets.OWNER_TOKEN }}
        run: |
          set -uo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [[ -n "$GH_TOKEN" ]] || fail "no owner token"
          # Bind this call to what announce showed the owner.
          sha="$(printf '%s' "$PAYLOAD" | sha256sum | cut -d' ' -f1)"
          [[ "$METHOD" == "$EXPECT_METHOD" ]] || fail "method differs from announce"
          [[ "$ENDPOINT" == "$EXPECT_ENDPOINT" ]] || fail "endpoint differs from announce"
          [[ "$sha" == "$EXPECT_SHA256" ]] || fail "body differs from announce"

          out="$(mktemp)"
          if [[ -n "$PAYLOAD" ]]; then
            printf '%s' "$PAYLOAD" | gh api -i -X "$METHOD" "$ENDPOINT" --input - >"$out" 2>/dev/null
          else
            gh api -i -X "$METHOD" "$ENDPOINT" >"$out" 2>/dev/null </dev/null
          fi

          # Only the status line is ever printed; the response body and gh stderr
          # are never shown (API error text can echo request data into a public log).
          status_line="$(head -n 1 "$out" | tr -d '\r')"
          rm -f "$out"
          echo "$ACTION $ENDPOINT -> ${status_line:-no response}"

          code="$(awk '{print $2}' <<<"$status_line")"
          [[ "$code" =~ ^2[0-9][0-9]$ ]] || exit 1

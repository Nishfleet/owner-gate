name: owner-action

run-name: "owner ${{ inputs.action }} ${{ inputs.repo }} ${{ inputs.id }} ${{ inputs.body && format('body={0} ', toJSON(inputs.body)) || '' }}| reason (agent-provided): ${{ inputs.reason }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: Named owner action (fixed list)
        type: choice
        required: true
        options:
          - ruleset-create
          - ruleset-update
          - ruleset-delete
          - repo-create
          - repo-settings
          - repo-archive
          - actions-workflow-permissions
          - vulnerability-alerts-enable
          - test-read-org
      repo:
        description: Repo name under Nishfleet (only for repo actions)
        type: string
        required: false
      id:
        description: Numeric ruleset id (only for update/delete actions)
        type: string
        required: false
      body:
        description: JSON object body (only for actions that take one; never put secrets here)
        type: string
        required: false
      reason:
        description: Plain-English reason; must name the target (ids are not resolved for the owner)
        type: string
        required: true

permissions: {}

jobs:
  announce:
    name: announce request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      method: ${{ steps.resolve.outputs.method }}
      endpoint: ${{ steps.resolve.outputs.endpoint }}
      body_sha256: ${{ steps.resolve.outputs.body_sha256 }}
    steps:
      - name: Show what the owner is asked to approve
        id: resolve
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          REPO: ${{ inputs.repo }}
          ID: ${{ inputs.id }}
          BODY: ${{ inputs.body }}
        run: |
          set -uo pipefail
          fail() { echo "::error::$1"; exit 1; }

          owner="Nishfleet"
          need_repo=0
          need_id=0
          body_mode=none   # none | required | fixed
          payload=""

          case "$ACTION" in
            ruleset-create)               method=POST;   need_repo=1; body_mode=required; tpl="repos/$owner/@REPO@/rulesets" ;;
            ruleset-update)               method=PUT;    need_repo=1; need_id=1; body_mode=required; tpl="repos/$owner/@REPO@/rulesets/@ID@" ;;
            ruleset-delete)               method=DELETE; need_repo=1; need_id=1; tpl="repos/$owner/@REPO@/rulesets/@ID@" ;;
            repo-create)                  method=POST;   body_mode=required; tpl="orgs/$owner/repos" ;;
            repo-settings)                method=PATCH;  need_repo=1; body_mode=required; tpl="repos/$owner/@REPO@" ;;
            repo-archive)                 method=PATCH;  need_repo=1; body_mode=fixed; payload='{"archived":true}'; tpl="repos/$owner/@REPO@" ;;
            actions-workflow-permissions) method=PUT;    need_repo=1; body_mode=required; tpl="repos/$owner/@REPO@/actions/permissions/workflow" ;;
            vulnerability-alerts-enable)  method=PUT;    need_repo=1; tpl="repos/$owner/@REPO@/vulnerability-alerts" ;;
            test-read-org)                method=GET;    tpl="orgs/$owner" ;;
            *) fail "unknown action" ;;
          esac

          endpoint="$tpl"

          if [[ "$need_repo" == 1 ]]; then
            [[ "$REPO" =~ ^[A-Za-z0-9._-]{1,100}$ ]] || fail "invalid or missing repo"
            [[ "$REPO" =~ ^\.+$ ]] && fail "invalid repo"
            [[ "${REPO,,}" == "owner-gate" ]] && fail "the gate cannot act on itself"
            endpoint="${endpoint//@REPO@/$REPO}"
          else
            [[ -z "$REPO" ]] || fail "repo not allowed for this action"
          fi

          if [[ "$need_id" == 1 ]]; then
            [[ "$ID" =~ ^[0-9]{1,20}$ ]] || fail "invalid or missing id"
            endpoint="${endpoint//@ID@/$ID}"
          else
            [[ -z "$ID" ]] || fail "id not allowed for this action"
          fi

          case "$body_mode" in
            required)
              [[ -n "$BODY" ]] || fail "body required for this action"
              [[ "$(printf '%s' "$BODY" | wc -c)" -le 8000 ]] || fail "body larger than 8000 bytes"
              printf '%s' "$BODY" | jq empty >/dev/null 2>&1 || fail "body is not valid JSON"
              printf '%s' "$BODY" | jq -s -e 'length == 1 and (.[0] | type == "object")' >/dev/null 2>&1 \
                || fail "body must be a single JSON object"
              payload="$BODY"
              case "$ACTION" in
                repo-settings)
                  printf '%s' "$BODY" | jq -e '[.. | objects | keys[]]
                    | any(. == "visibility" or . == "private" or . == "security_and_analysis" or . == "archived" or . == "default_branch")
                    | not' >/dev/null 2>&1 \
                    || fail "repo-settings body may not contain visibility, private, security_and_analysis, archived or default_branch"
                  ;;
                actions-workflow-permissions)
                  printf '%s' "$BODY" | jq -e '((.can_approve_pull_request_reviews // false) == false)
                    and ((.default_workflow_permissions // "read") == "read")' >/dev/null 2>&1 \
                    || fail "can_approve_pull_request_reviews must be absent or false, and default_workflow_permissions absent or read"
                  ;;
                ruleset-create|ruleset-update)
                  printf '%s' "$BODY" | jq -e '((.enforcement | type == "string") and (.enforcement | ascii_downcase) == "active")
                    and ((.bypass_actors // []) == [])' >/dev/null 2>&1 \
                    || fail "ruleset body must set enforcement to active and may not set bypass_actors"
                  ;;
              esac
              ;;
            *)
              [[ -z "$BODY" ]] || fail "body not allowed for this action"
              ;;
          esac

          sha="$(printf '%s' "$payload" | sha256sum | cut -d' ' -f1)"
          if [[ -n "$payload" ]]; then
            full="$(printf '%s' "$payload" | jq -c .)"
          else
            full="(none)"
          fi

          # Full request, readable on the run page and in the log. Public by contract.
          echo "OWNER APPROVAL REQUEST: action=$ACTION method=$method endpoint=$endpoint body_sha256=$sha body=$full"
          {
            echo "### Owner approval request"
            echo
            echo "- action: \`$ACTION\`"
            echo "- method: \`$method\`"
            echo "- endpoint: \`$endpoint\`"
            echo "- body sha256: \`$sha\`"
            echo
            echo "Full body (compacted JSON):"
            echo
            echo '```json'
            echo "$full"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

          {
            echo "method=$method"
            echo "endpoint=$endpoint"
            echo "body_sha256=$sha"
          } >>"$GITHUB_OUTPUT"

  act:
    name: owner api call
    needs: announce
    runs-on: ubuntu-24.04
    environment: owner
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Re-validate and call GitHub API as owner
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          REPO: ${{ inputs.repo }}
          ID: ${{ inputs.id }}
          BODY: ${{ inputs.body }}
          EXPECT_METHOD: ${{ needs.announce.outputs.method }}
          EXPECT_ENDPOINT: ${{ needs.announce.outputs.endpoint }}
          EXPECT_SHA256: ${{ needs.announce.outputs.body_sha256 }}
          GH_TOKEN: ${{ secrets.OWNER_TOKEN }}
        run: |
          set -uo pipefail
          fail() { echo "::error::$1"; exit 1; }

          owner="Nishfleet"
          need_repo=0
          need_id=0
          body_mode=none   # none | required | fixed
          payload=""

          case "$ACTION" in
            ruleset-create)               method=POST;   need_repo=1; body_mode=required; tpl="repos/$owner/@REPO@/rulesets" ;;
            ruleset-update)               method=PUT;    need_repo=1; need_id=1; body_mode=required; tpl="repos/$owner/@REPO@/rulesets/@ID@" ;;
            ruleset-delete)               method=DELETE; need_repo=1; need_id=1; tpl="repos/$owner/@REPO@/rulesets/@ID@" ;;
            repo-create)                  method=POST;   body_mode=required; tpl="orgs/$owner/repos" ;;
            repo-settings)                method=PATCH;  need_repo=1; body_mode=required; tpl="repos/$owner/@REPO@" ;;
            repo-archive)                 method=PATCH;  need_repo=1; body_mode=fixed; payload='{"archived":true}'; tpl="repos/$owner/@REPO@" ;;
            actions-workflow-permissions) method=PUT;    need_repo=1; body_mode=required; tpl="repos/$owner/@REPO@/actions/permissions/workflow" ;;
            vulnerability-alerts-enable)  method=PUT;    need_repo=1; tpl="repos/$owner/@REPO@/vulnerability-alerts" ;;
            test-read-org)                method=GET;    tpl="orgs/$owner" ;;
            *) fail "unknown action" ;;
          esac

          endpoint="$tpl"

          if [[ "$need_repo" == 1 ]]; then
            [[ "$REPO" =~ ^[A-Za-z0-9._-]{1,100}$ ]] || fail "invalid or missing repo"
            [[ "$REPO" =~ ^\.+$ ]] && fail "invalid repo"
            [[ "${REPO,,}" == "owner-gate" ]] && fail "the gate cannot act on itself"
            endpoint="${endpoint//@REPO@/$REPO}"
          else
            [[ -z "$REPO" ]] || fail "repo not allowed for this action"
          fi

          if [[ "$need_id" == 1 ]]; then
            [[ "$ID" =~ ^[0-9]{1,20}$ ]] || fail "invalid or missing id"
            endpoint="${endpoint//@ID@/$ID}"
          else
            [[ -z "$ID" ]] || fail "id not allowed for this action"
          fi

          case "$body_mode" in
            required)
              [[ -n "$BODY" ]] || fail "body required for this action"
              [[ "$(printf '%s' "$BODY" | wc -c)" -le 8000 ]] || fail "body larger than 8000 bytes"
              printf '%s' "$BODY" | jq empty >/dev/null 2>&1 || fail "body is not valid JSON"
              printf '%s' "$BODY" | jq -s -e 'length == 1 and (.[0] | type == "object")' >/dev/null 2>&1 \
                || fail "body must be a single JSON object"
              payload="$BODY"
              case "$ACTION" in
                repo-settings)
                  printf '%s' "$BODY" | jq -e '[.. | objects | keys[]]
                    | any(. == "visibility" or . == "private" or . == "security_and_analysis" or . == "archived" or . == "default_branch")
                    | not' >/dev/null 2>&1 \
                    || fail "repo-settings body may not contain visibility, private, security_and_analysis, archived or default_branch"
                  ;;
                actions-workflow-permissions)
                  printf '%s' "$BODY" | jq -e '((.can_approve_pull_request_reviews // false) == false)
                    and ((.default_workflow_permissions // "read") == "read")' >/dev/null 2>&1 \
                    || fail "can_approve_pull_request_reviews must be absent or false, and default_workflow_permissions absent or read"
                  ;;
                ruleset-create|ruleset-update)
                  printf '%s' "$BODY" | jq -e '((.enforcement | type == "string") and (.enforcement | ascii_downcase) == "active")
                    and ((.bypass_actors // []) == [])' >/dev/null 2>&1 \
                    || fail "ruleset body must set enforcement to active and may not set bypass_actors"
                  ;;
              esac
              ;;
            *)
              [[ -z "$BODY" ]] || fail "body not allowed for this action"
              ;;
          esac

          # Bind this call to what announce showed the owner.
          sha="$(printf '%s' "$payload" | sha256sum | cut -d' ' -f1)"
          [[ "$method" == "$EXPECT_METHOD" ]] || fail "method differs from announce"
          [[ "$endpoint" == "$EXPECT_ENDPOINT" ]] || fail "endpoint differs from announce"
          [[ "$sha" == "$EXPECT_SHA256" ]] || fail "body differs from announce"

          out="$(mktemp)"
          if [[ -n "$payload" ]]; then
            printf '%s' "$payload" | gh api -i -X "$method" "$endpoint" --input - >"$out" 2>/dev/null
          else
            gh api -i -X "$method" "$endpoint" >"$out" 2>/dev/null </dev/null
          fi

          # Only the status line is ever printed; the response body and gh stderr
          # are never shown (API error text can echo request data into a public log).
          status_line="$(head -n 1 "$out" | tr -d '\r')"
          rm -f "$out"
          echo "$ACTION $endpoint -> ${status_line:-no response}"

          code="$(awk '{print $2}' <<<"$status_line")"
          [[ "$code" =~ ^2[0-9][0-9]$ ]] || exit 1

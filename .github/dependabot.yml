# Stock dependency watch for GitHub Actions. Every `uses:` in
# .github/workflows/ is pinned to a full commit SHA with a version comment, and
# this keeps both current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 3
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: [minor, patch]
